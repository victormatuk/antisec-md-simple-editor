<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Editor</title>
  <link rel="stylesheet" href="style.css" />
  <link id="md-theme" rel="stylesheet"
    href="vendor/css/github-markdown-light.css" />

  <!-- highlight.js theme (swapped via JS when toggling theme) -->
  <link id="hljs-theme" rel="stylesheet"
    href="vendor/css/highlight-github.min.css" />

  <!-- Dependencies (local) -->
  <script src="vendor/js/marked.min.js"></script>
  <script src="vendor/js/purify.min.js"></script>
  <script src="vendor/js/highlight.min.js"></script>
  <script type="module" src="vendor/js/markdown-toolbar-element.js"></script>
</head>

<body>
  <div id="app">

    <!-- ── Toolbar ── -->
    <div id="toolbar">
      <span class="logo">MD Editor v1.21</span>
      <div class="sep"></div>

      <button id="btn-open" title="Open file (Ctrl+O)">

        </svg>
        Open

      <button id="btn-save" title="Save file (Ctrl+S)">

            d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-9.5C1 1.784 1.784 1 2.75 1h8.688c.464 0 .909.185 1.237.513l2.312 2.312c.328.328.513.773.513 1.237v7.938A1.75 1.75 0 0 1 13.25 14H2.75Zm0-1.5h10.5a.25.25 0 0 0 .25-.25V5.062a.25.25 0 0 0-.073-.177L11.116 2.573a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25ZM5 4.75A.75.75 0 0 1 5.75 4h4.5a.75.75 0 0 1 0 1.5h-4.5A.75.75 0 0 1 5 4.75ZM4.75 8a3.25 3.25 0 1 1 6.5 0 3.25 3.25 0 0 1-6.5 0ZM8 6.25a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5Z" />
        </svg>
        Save
      </button>

      <button id="btn-copy" title="Copy generated HTML">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z" />
          <path
            d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z" />
        </svg>
        Copy HTML
      </button>

      <div class="sep"></div>

      <button id="btn-sync" title="Synchronized scroll">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" />
        </svg>
        Sync
      </button>

      <div class="spacer"></div>

      <div id="notifs-wrap">
        <button id="btn-notifs" title="Lembretes agendados">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 16a2 2 0 0 0 1.985-1.75c.017-.137-.097-.25-.235-.25h-3.5c-.138 0-.252.113-.235.25A2 2 0 0 0 8 16ZM3 5a5 5 0 0 1 10 0v2.947c0 .05.015.098.042.139l1.703 2.555A1.519 1.519 0 0 1 13.482 13H2.518a1.516 1.516 0 0 1-1.263-2.36l1.703-2.554A.255.255 0 0 0 3 7.947Z"/>
          </svg>
          <span id="btn-notifs-count"></span>
        </button>
        <div id="notifs-panel" style="display:none">
          <div class="notifs-panel-header">
            <span>Lembretes agendados</span>
            <button id="btn-notif-sound" type="button" title="Som ao disparar lembrete">🔔</button>
          </div>
          <ul id="notifs-list"></ul>
          <div class="notifs-panel-hint">Para cancelar, apague o <code>@notify(...)</code> do texto e salve.</div>
        </div>
      </div>

      <button id="btn-theme" title="Toggle theme (Ctrl+Shift+D)">🌙</button>

      <input type="file" id="file-input" accept=".md,.markdown,.txt" />
    </div>

    <!-- ── Reopen banner ── -->
    <div id="reopen-banner" style="display:none">
      <span id="reopen-msg"></span>
      <div class="reopen-actions">
        <button id="btn-reopen-yes">Reopen</button>
        <button id="btn-reopen-no">Ignore</button>
      </div>
    </div>

    <!-- ── Panes ── -->
    <div id="panes">
      <div id="editor-pane">
        <div class="pane-header">
          <span>Editor</span>
          <span id="filename-label">new-file.md</span>
        </div>
        <markdown-toolbar for="editor" id="format-bar">
          <md-header level="1" class="fb-btn" title="Heading 1">H1</md-header>
          <md-header level="2" class="fb-btn" title="Heading 2">H2</md-header>
          <md-header level="3" class="fb-btn" title="Heading 3">H3</md-header>
          <md-header level="4" class="fb-btn" title="Heading 4">H4</md-header>
          <md-header level="5" class="fb-btn" title="Heading 5">H5</md-header>
          <md-header level="6" class="fb-btn" title="Heading 6">H6</md-header>
          <span class="fb-sep"></span>
          <md-bold class="fb-btn" title="Bold (Ctrl+B)"><strong>B</strong></md-bold>
          <md-italic class="fb-btn" title="Italic (Ctrl+I)"><em>I</em></md-italic>
          <md-strikethrough class="fb-btn" title="Strikethrough"><s>S</s></md-strikethrough>
          <md-code class="fb-btn" title="Inline code (Ctrl+E)">&lt;/&gt;</md-code>
          <span class="fb-sep"></span>
          <md-quote class="fb-btn" title="Quote">&ldquo; &rdquo;</md-quote>
          <md-unordered-list class="fb-btn" title="List">• ─</md-unordered-list>
          <md-ordered-list class="fb-btn" title="Numbered list">1. 2.</md-ordered-list>
          <md-task-list class="fb-btn" title="Task list">[ ]</md-task-list>
          <span class="fb-sep"></span>
          <md-link class="fb-btn" title="Link (Ctrl+K)">link</md-link>
          <md-image class="fb-btn" title="Image">img</md-image>
          <span class="fb-sep"></span>
          <md-mention class="fb-btn" title="Mention">@</md-mention>
          <md-ref class="fb-btn" title="Reference (issue/PR)">#</md-ref>
          <span class="fb-sep"></span>
          <button type="button" class="fb-btn fb-custom" data-action="bold-italic" title="Bold + italic">B<em>I</em></button>
          <button type="button" class="fb-btn fb-custom" data-action="codeblock" title="Code block (with language)">{ }</button>
          <button type="button" class="fb-btn fb-custom" data-action="table" title="Insert table">▦</button>
          <button type="button" class="fb-btn fb-custom" data-action="hr" title="Horizontal rule">―</button>
          <button type="button" class="fb-btn fb-custom" data-action="linebreak" title="Line break (2 spaces + enter)">↵</button>
          <span class="fb-sep"></span>
          <button type="button" class="fb-btn fb-custom" data-action="sub" title="Subscript">X₂</button>
          <button type="button" class="fb-btn fb-custom" data-action="sup" title="Superscript">X²</button>
          <button type="button" class="fb-btn fb-custom" data-action="mark" title="Highlight (&lt;mark&gt;)">mk</button>
          <button type="button" class="fb-btn fb-custom" data-action="ins" title="Underline (&lt;ins&gt;)">U</button>
          <button type="button" class="fb-btn fb-custom" data-action="kbd" title="Key (&lt;kbd&gt;)">⌨</button>
          <button type="button" class="fb-btn fb-custom" data-action="abbr" title="Abbreviation (&lt;abbr&gt;)">ab</button>
          <button type="button" class="fb-btn fb-custom" data-action="details" title="Collapsible block (&lt;details&gt;)">▾</button>
          <span class="fb-sep"></span>
          <button type="button" class="fb-btn fb-custom" data-action="notify" title="Lembrete @notify(30m, texto)">⏰</button>
        </markdown-toolbar>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>

      <div id="resizer"></div>

      <div id="preview-pane">
        <div class="pane-header">
          <span>Preview</span>
          <span id="unsaved-dot"></span>
        </div>
        <div id="preview" class="markdown-body"></div>
      </div>
    </div>

    <!-- ── Autocomplete dropdown ── -->
    <div id="autocomplete" style="display:none"></div>

    <!-- ── Status bar ── -->
    <div id="statusbar">
      <span id="stat-words">0 words</span>
      <span>·</span>
      <span id="stat-chars">0 characters</span>
      <span>·</span>
      <span id="stat-lines">1 line</span>
      <span>·</span>
      <span id="stat-time">—</span>
    </div>

  </div>

  <script>
    (function () {
      /* ── State ── */
      let isDark = false;
      let syncScroll = true;
      let currentFilename = 'new-file.md';
      let savedContent = '';
      let syncingFromEditor = false;
      let syncingFromPreview = false;
      let fileHandle = null;

      /* ── Elements ── */
      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview');
      const fileInput = document.getElementById('file-input');
      const btnOpen = document.getElementById('btn-open');
      const btnSave = document.getElementById('btn-save');
      const btnCopy = document.getElementById('btn-copy');
      const btnSync = document.getElementById('btn-sync');
      const btnTheme = document.getElementById('btn-theme');
      const hlTheme = document.getElementById('hljs-theme');
      const mdTheme = document.getElementById('md-theme');
      const statWords = document.getElementById('stat-words');
      const statChars = document.getElementById('stat-chars');
      const statLines = document.getElementById('stat-lines');
      const statTime = document.getElementById('stat-time');
      const filenameLabel = document.getElementById('filename-label');
      const unsavedDot = document.getElementById('unsaved-dot');
      const btnNotifs = document.getElementById('btn-notifs');
      const btnNotifsCount = document.getElementById('btn-notifs-count');
      const notifsPanel = document.getElementById('notifs-panel');
      const notifsList = document.getElementById('notifs-list');
      const btnNotifSound = document.getElementById('btn-notif-sound');

      /* ── IndexedDB helper (persists fileHandle across reloads) ── */
      const IDB_NAME = 'md-editor', IDB_STORE = 'state', IDB_KEY = 'fileHandle';
      const IDB_NOTIFS_KEY = 'scheduledNotifications';

      function idbOpen() {
        return new Promise((res, rej) => {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      }

      async function idbGet(key) {
        const db = await idbOpen();
        return new Promise((res, rej) => {
          const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      }

      async function idbSet(key, value) {
        const db = await idbOpen();
        return new Promise((res, rej) => {
          const req = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(value, key);
          req.onsuccess = () => res();
          req.onerror = () => rej(req.error);
        });
      }

      async function idbDel(key) {
        const db = await idbOpen();
        return new Promise((res, rej) => {
          const req = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).delete(key);
          req.onsuccess = () => res();
          req.onerror = () => rej(req.error);
        });
      }

      /* ── Save feedback (shown briefly in the unsaved-dot slot) ── */
      let saveFeedbackTimer = null;
      function showSaveFeedback(msg) {
        if (saveFeedbackTimer) clearTimeout(saveFeedbackTimer);
        unsavedDot.textContent = msg;
        unsavedDot.className = 'save-feedback';
        saveFeedbackTimer = setTimeout(() => {
          saveFeedbackTimer = null;
          render();
        }, 2200);
      }

      /* ── Notifications: parser, persistence, scheduling ── */
      const NOTIFY_RE = /@notify\(\s*([0-9a-zA-Z: ]+?)\s*,\s*([^)]+?)\s*\)/g;

      function parseWhen(spec, now = Date.now()) {
        const abs = spec.match(/^(\d{4})(\d{2})(\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        if (abs) {
          const [, Y, Mo, D, H, Mi, S] = abs;
          const t = new Date(+Y, +Mo - 1, +D, +H, +Mi, S ? +S : 0, 0).getTime();
          return Number.isNaN(t) ? null : t;
        }
        const norm = spec.replace(/(\d+\s*h)\s*(\d+)(?!\s*[hms])/gi, '$1$2m');
        if (!/^(?:\s*\d+\s*[hms]\s*)+$/i.test(norm)) return null;

        let total = 0, m;
        const re = /(\d+)\s*([hms])/gi;
        while ((m = re.exec(norm)) !== null) {
          const n = parseInt(m[1], 10);
          const u = m[2].toLowerCase();
          if (u === 'h') total += n * 3600000;
          else if (u === 'm') total += n * 60000;
          else if (u === 's') total += n * 1000;
        }
        if (total <= 0) return null;
        return now + total;
      }

      async function notifId(spec, text) {
        const data = new TextEncoder().encode(`${spec}|${text}`);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash).slice(0, 8))
          .map(b => b.toString(16).padStart(2, '0')).join('');
      }

      async function loadScheduledNotifs() {
        return (await idbGet(IDB_NOTIFS_KEY)) || [];
      }

      async function saveScheduledNotifs(list) {
        await idbSet(IDB_NOTIFS_KEY, list);
      }

      const activeTimers = new Map();

      function armTimer(id, text, firesAt) {
        if (activeTimers.has(id)) clearTimeout(activeTimers.get(id));
        const delay = Math.max(0, firesAt - Date.now());
        const tid = setTimeout(() => fireNotification(id, text), delay);
        activeTimers.set(id, tid);
      }

      function cancelTimer(id) {
        if (activeTimers.has(id)) {
          clearTimeout(activeTimers.get(id));
          activeTimers.delete(id);
        }
      }

      async function fireNotification(id, text) {
        activeTimers.delete(id);
        try {
          new Notification('MD Editor', { body: text, requireInteraction: true, tag: id });
        } catch {}
        playNotificationSound();
        const list = (await loadScheduledNotifs()).filter(n => n.id !== id);
        await saveScheduledNotifs(list);
        refreshNotifsCount();
      }

      /* ── Notification sound (Web Audio, lazy) ── */
      let soundEnabled = localStorage.getItem('notifSoundEnabled') !== '0';
      let audioCtx = null;

      function playNotificationSound() {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          // Two short tones (880 → 660 Hz) with quick fade in/out to avoid click.
          [{ f: 880, t: 0 }, { f: 660, t: 0.18 }].forEach(({ f, t }) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = f;
            gain.gain.setValueAtTime(0, now + t);
            gain.gain.linearRampToValueAtTime(0.18, now + t + 0.02);
            gain.gain.linearRampToValueAtTime(0, now + t + 0.16);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + t);
            osc.stop(now + t + 0.17);
          });
        } catch { /* audio blocked or unsupported */ }
      }

      async function scheduleNotificationsFromText(text) {
        if (!('Notification' in window)) return { added: 0, removed: 0 };
        const matches = [...text.matchAll(NOTIFY_RE)];

        const existing = await loadScheduledNotifs();
        const now = Date.now();

        // Compute the set of IDs that should be active given the current text.
        const desiredIds = new Set();
        const newOnes = [];
        for (const m of matches) {
          const spec = m[1].trim();
          const txt = m[2].trim();
          const firesAt = parseWhen(spec, now);
          if (firesAt == null || firesAt <= now) continue;
          const id = await notifId(spec, txt);
          desiredIds.add(id);
          if (!existing.some(n => n.id === id)) {
            newOnes.push({ id, text: txt, spec, scheduledAt: now, firesAt });
          }
        }

        // Anything in existing that's no longer in the text: cancel.
        const removed = [];
        const kept = [];
        for (const n of existing) {
          if (desiredIds.has(n.id)) kept.push(n);
          else { cancelTimer(n.id); removed.push(n); }
        }

        // Request permission only if we have new ones to schedule.
        if (newOnes.length > 0) {
          if (Notification.permission === 'default') {
            const perm = await Notification.requestPermission();
            if (perm !== 'granted') newOnes.length = 0;
          } else if (Notification.permission !== 'granted') {
            newOnes.length = 0;
          }
        }

        for (const n of newOnes) {
          armTimer(n.id, n.text, n.firesAt);
          kept.push(n);
        }

        if (newOnes.length > 0 || removed.length > 0) {
          await saveScheduledNotifs(kept);
        }
        return { added: newOnes.length, removed: removed.length };
      }

      /* ── marked config ── */
      marked.use({
        breaks: true,
        gfm: true,
        renderer: {
          code(code, infostring) {
            const lang = (infostring || '').match(/\S*/)[0];
            const language = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
            const highlighted = hljs.highlight(code || '', { language }).value;
            return `<pre><code class="hljs language-${language}">${highlighted}</code></pre>`;
          }
        }
      });

      /* ── Render ── */
      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function preprocessMarkdown(src) {
        // Accepts "[]" as shorthand for "[ ]" in task lists (GFM requires the space).
        src = src.replace(/^(\s*[-*+]\s+)\[\](?=\s|$)/gm, '$1[ ]');
        // Turn @notify(spec, text) into a badge before marked sees it.
        src = src.replace(NOTIFY_RE, (_, spec, text) => {
          const s = spec.trim(), t = text.trim();
          const firesAt = parseWhen(s);
          const ok = firesAt != null && firesAt > Date.now();
          const cls = ok ? 'notify-badge' : 'notify-badge notify-badge-err';
          return `<span class="${cls}">⏰ ${escapeHtml(s)} · ${escapeHtml(t)}</span>`;
        });
        return src;
      }

      function render() {
        const raw = editor.value;
        const dirty = raw !== savedContent;
        unsavedDot.textContent = dirty ? '● unsaved' : '';
        unsavedDot.className = dirty ? 'unsaved' : '';

        const html = DOMPurify.sanitize(marked.parse(preprocessMarkdown(raw)));
        preview.innerHTML = html;
        updateStats(raw);
      }

      function updateStats(text) {
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        const chars = text.length;
        const lines = text.split('\n').length;

        statWords.textContent = `${words} ${words === 1 ? 'word' : 'words'}`;
        statChars.textContent = `${chars} ${chars === 1 ? 'character' : 'characters'}`;
        statLines.textContent = `${lines} ${lines === 1 ? 'line' : 'lines'}`;
        statTime.textContent = estimateReadTime(words);
      }

      function estimateReadTime(words) {
        const mins = Math.ceil(words / 200);
        return mins <= 0 ? '—' : `~${mins} min read`;
      }

      /* ── Default content ── */
      const defaultContent = `# Welcome to MD Editor

Write **Markdown** on the left and see the rendered result in real time on the right.

---

## 1. Headings

# H1 — Heading level 1
## H2 — Heading level 2
### H3 — Heading level 3
#### H4 — Heading level 4
##### H5 — Heading level 5
###### H6 — Heading level 6

Alternative H1 heading
======================

Alternative H2 heading
----------------------

---

## 2. Emphasis and text style

- **Bold** or __also bold__
- *Italic* or _also italic_
- ***Bold and italic*** or ___combined___
- ~~Strikethrough~~
- \`inline code\` with \`backticks\`
- Normal text with <ins>HTML underline</ins> and <mark>highlight</mark>
- Subscript: H<sub>2</sub>O — Superscript: E = mc<sup>2</sup>
- Character escaping: \\*not italic\\* and \\\`not code\\\`

---

## 3. Lists

### Unordered list

- Item A
- Item B
  - Subitem B.1
  - Subitem B.2
    - Sub-subitem B.2.a
- Item C

* Also works with an asterisk
+ Or with a plus sign

### Ordered list

1. First
2. Second
   1. Nested 2.1
   2. Nested 2.2
3. Third
4. Fourth

### Task list

- [x] Completed task
- [ ] Pending task
- [] Shortcut: empty brackets automatically become \`[ ]\`
- [x] Buy milk
  - [ ] Pending subtask
  - [x] Completed subtask

---

## 4. Links and images

- Simple link: [Anthropic](https://www.anthropic.com)
- Link with title: [Claude](https://claude.ai "Claude's official site")
- Autolink: <https://example.com>
- Email: <contact@example.com>
- Reference link: [GitHub][gh-ref]

[gh-ref]: https://github.com "Repositories of the world"

Image:

![Markdown Logo](https://upload.wikimedia.org/wikipedia/commons/4/48/Markdown-mark.svg)

Image with clickable link:

[![Markdown Logo](https://upload.wikimedia.org/wikipedia/commons/4/48/Markdown-mark.svg)](https://daringfireball.net/projects/markdown/)

---

## 5. Blockquotes

> This is a simple quote.

> Quote with **bold** and *italic*.
>
> Second paragraph of the same quote.

> Level 1
>> Level 2 (nested)
>>> Level 3
>>>> Level 4

> 💡 **Tip:** you can mix lists inside quotes:
> - Item 1
> - Item 2

---

## 6. Code

### Inline

      function caretCoords(textarea, pos) {

        const style = window.getComputedStyle(textarea);
        const props = [
          'boxSizing', 'width', 'height', 'overflowX', 'overflowY',
          'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
          'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
          'fontStyle', 'fontVariant', 'fontWeight', 'fontStretch', 'fontSize',
          'lineHeight', 'fontFamily', 'textAlign', 'textTransform', 'textIndent',
          'letterSpacing', 'wordSpacing', 'tabSize'
        ];
        props.forEach(p => { div.style[p] = style[p]; });
        div.style.whiteSpace = 'pre-wrap';
        div.style.wordWrap = 'break-word';
        div.style.position = 'absolute';
        div.style.visibility = 'hidden';
        div.style.top = '0';
        div.style.left = '0';

        div.textContent = textarea.value.substring(0, pos);
        const span = document.createElement('span');
        span.textContent = textarea.value.substring(pos) || '.';
        div.appendChild(span);
        document.body.appendChild(div);

        const rect = textarea.getBoundingClientRect();
        const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.2;
        const result = {
          top: rect.top - textarea.scrollTop + span.offsetTop,
          left: rect.left - textarea.scrollLeft + span.offsetLeft,
          lineHeight,
        };
        document.body.removeChild(div);
        return result;
      }

          name.className = 'ac-name';

          desc.className = 'ac-desc';

        if (i > 0 && /[a-zA-Z0-9_]/.test(text[i - 1])) { hideAC(); return; }
        const query = text.substring(i, cursor);

          e.preventDefault(); e.stopPropagation();
          acState.selected = (acState.selected + 1) % acState.items.length;
          renderAC();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault(); e.stopPropagation();
          acState.selected = (acState.selected - 1 + acState.items.length) % acState.items.length;
          renderAC();
        } else if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault(); e.stopPropagation();
          selectAC(acState.selected);
        } else if (e.key === 'Escape') {
          e.preventDefault(); e.stopPropagation();
          hideAC();
        }
      }, true);

    })();
  </script>
</body>

</html>
